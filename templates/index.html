<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a0f">
  <title>زولك AI 🇸🇩</title>

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

  <header class="topbar">

    <div class="logo">
      زولك <span>AI</span> 🇸🇩
    </div>

    <nav>
      <span id="who"></span>

      <a href="/login" id="loginLink">دخول</a>

      <a href="/admin" id="adminLink" hidden>لوحة زولك</a>

      <a href="/logout" id="logout" hidden>خروج</a>
    </nav>

  </header>


  <main class="chat-app">

    <div class="chat-header">

      <div class="ai-avatar">Z</div>

      <div class="ai-info">
        <strong>زولك AI</strong>
        <small>
          مساعدك الذكي السوداني 🇸🇩
          <i></i>
        </small>
      </div>

    </div>


    <div id="messages" class="messages">

      <div class="welcome">

        <div class="welcome-icon">🇸🇩</div>

        <h1>أها يا زول 👋</h1>

        <p>زولك جاهز يساعدك.</p>

      </div>

      <div class="msg ai">
        قول لي عايز شنو؟ 😄
      </div>

    </div>


    <div class="suggestions">

      <button>✍️ اكتب لي منشور</button>
      <button>📝 ظبط لي الكلام</button>
      <button>📚 فهمني</button>
      <button>💡 أديني فكرة</button>

    </div>


    <div class="composer">

      <textarea
        id="prompt"
        placeholder="اكتب رسالتك..."
        rows="1"
      ></textarea>

      <button id="send" aria-label="إرسال">
        🚀
      </button>

    </div>


    <div class="bottom-info">

      <div id="credits" class="credits"></div>

      <span>زولك AI 🇸🇩</span>

    </div>

  </main>

</div>


<script src="/static/app.js"></script>

</body>
</html>
