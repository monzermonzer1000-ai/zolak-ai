<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">

  <title>زولك AI 🇸🇩</title>

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="chatgpt-layout">

  <!-- الشريط الجانبي -->
  <aside class="sidebar">

    <div class="sidebar-top">

      <div class="brand">
        <div class="brand-icon">Z</div>
        <div>
          <strong>زولك AI</strong>
          <small>🇸🇩 مساعدك الذكي</small>
        </div>
      </div>

      <button class="new-chat" type="button">
        <span>＋</span>
        محادثة جديدة
      </button>

    </div>


    <div class="sidebar-section">

      <div class="sidebar-label">
        المحادثات
      </div>

      <div class="chat-item active">
        <span>💬</span>
        <span>محادثة جديدة</span>
      </div>

    </div>


    <div class="sidebar-bottom">

      <div class="account">

        <div class="account-avatar">
          ز
        </div>

        <div class="account-info">
          <strong id="who">زائر</strong>
          <small>حساب زولك</small>
        </div>

      </div>

      <div class="account-links">

        <a href="/login" id="loginLink">
          دخول / إنشاء حساب
        </a>

        <a href="/admin" id="adminLink" hidden>
          لوحة زولك
        </a>

        <a href="/logout" id="logout" hidden>
          تسجيل الخروج
        </a>

      </div>

    </div>

  </aside>


  <!-- منطقة المحادثة -->
  <main class="main-chat">

    <!-- الهيدر -->
    <header class="chat-navbar">

      <button class="mobile-menu" type="button" aria-label="القائمة">
        ☰
      </button>

      <div class="model-name">
        <strong>زولك AI</strong>
        <span>🇸🇩</span>
      </div>

      <div class="navbar-status">
        <span></span>
        متصل
      </div>

    </header>


    <!-- الرسائل -->
    <section id="messages" class="messages">

      <div class="welcome-screen">

        <div class="welcome-logo">
          Z
        </div>

        <h1>كيف أقدر أساعدك؟</h1>

        <p>
          زولك AI — مساعدك الذكي بطابع سوداني 🇸🇩
        </p>

        <div class="quick-actions">

          <button type="button">
            <span>✍️</span>
            <div>
              <strong>اكتب لي</strong>
              <small>منشور أو رسالة</small>
            </div>
          </button>

          <button type="button">
            <span>📚</span>
            <div>
              <strong>ساعدني أفهم</strong>
              <small>شرح وتبسيط</small>
            </div>
          </button>

          <button type="button">
            <span>📝</span>
            <div>
              <strong>عدّل الكلام</strong>
              <small>صياغة وتصحيح</small>
            </div>
          </button>

          <button type="button">
            <span>💡</span>
            <div>
              <strong>أديني فكرة</strong>
              <small>أفكار وحلول</small>
            </div>
          </button>

        </div>

      </div>

    </section>


    <!-- منطقة الكتابة -->
    <div class="composer-area">

      <div class="composer">

        <textarea
          id="prompt"
          rows="1"
          placeholder="اسأل زولك أي حاجة..."
          autocomplete="off"
        ></textarea>

        <button
          id="send"
          type="button"
          aria-label="إرسال"
        >
          ↑
        </button>

      </div>

      <div class="composer-footer">

        <span>
          زولك قد يخطئ أحياناً، راجع المعلومات المهمة.
        </span>

        <span id="credits" class="credits"></span>

      </div>

    </div>

  </main>

</div>


<script src="/static/app.js"></script>

</body>

  </html>
