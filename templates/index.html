<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name or "زولك AI 🇸🇩" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">Z</div>
                <div>
                    <strong>زولك AI</strong>
                    <span>مساعدك السوداني 🇸🇩</span>
                </div>
            </div>

            <button class="new-chat" type="button">
                + محادثة جديدة
            </button>

            <div class="sidebar-links">
                <a href="/">الرئيسية</a>
                <a href="/login" id="loginLink">تسجيل الدخول</a>
                <a href="/admin" id="adminLink" hidden>لوحة المدير</a>
                <a href="/logout" id="logout" hidden>تسجيل الخروج</a>
            </div>

            <div class="account-box">
                <div id="who">يا زول 👋</div>
                <div id="credits">سجّل دخولك للبدء</div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button class="mobile-menu" type="button">☰</button>
                <strong>زولك AI 🇸🇩</strong>
            </header>

            <section class="messages" id="messages">
                <div class="welcome-screen">
                    <div class="welcome-logo">Z</div>
                    <h1>كيف أقدر أساعدك؟</h1>
                    <p>زولك AI — مساعدك الذكي بطابع سوداني 🇸🇩</p>
                </div>
            </section>

            <div class="composer">
                <textarea
                    id="prompt"
                    placeholder="اكتب رسالتك هنا..."
                    rows="1"
                ></textarea>

                <button id="send" type="button">إرسال</button>
            </div>
        </main>

    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
