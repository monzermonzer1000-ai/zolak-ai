<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>تسجيل الدخول — زولك AI</title>

    <link rel="stylesheet" href="/static/style.css?v=9">

    <style>
        .auth {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #212121;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
        }

        .auth-logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .auth-logo span {
            color: #aaa;
        }

        .auth-card {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        .auth-card h2 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 22px;
        }

        .auth-subtitle {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .auth-input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 12px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #202020;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .auth-input:focus {
            border-color: #666;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #111;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .google-button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: 1px solid #555;
            border-radius: 10px;
            background: #fff;
            color: #111;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            color: #777;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #444;
        }

        .ghost {
            width: 100%;
            margin-top: 15px;
            border: none;
            background: transparent;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
        }

        .ghost:hover {
            color: white;
        }

        #err {
            color: #ff6b6b;
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
        }
    
        .auth {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            background:
                linear-gradient(125deg, rgba(2,18,15,.34), rgba(3,17,26,.48)),
                url("/static/sudan-flag-background.jpg") center / cover no-repeat,
                #071d18;
        }

        .auth::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 20% 15%, rgba(18,214,164,.22), transparent 42%);
            backdrop-filter: saturate(1.5);
        }

        .auth-box { position: relative; max-width: 440px; }

        .auth-logo {
            color: #f2fff8;
            font-size: 32px;
            letter-spacing: -.5px;
            text-shadow: 0 8px 28px rgba(0,0,0,.28);
        }

        .auth-logo span { color: #68e7bd; }

        .auth-card {
            padding: 32px;
            color: #f4fff9;
            background: rgba(4,25,20,.88);
            border: 1px solid rgba(220,255,240,.20);
            border-radius: 25px;
            box-shadow: 0 28px 90px rgba(0,0,0,.34);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .auth-card h2 { color: #fff; }
        .auth-subtitle { color: #b8d2c6; }

        .auth-input {
            min-height: 49px;
            color: #f4fff9;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(220,255,240,.18);
            border-radius: 13px;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .auth-input::placeholder { color: #a8c4b7; }

        .auth-input:focus {
            border-color: rgba(18,214,164,.75);
            box-shadow: 0 0 0 4px rgba(18,214,164,.12);
        }

        .login-button {
            min-height: 49px;
            color: #04251b;
            background: linear-gradient(145deg,#19dfad,#0a9b74);
            border-radius: 13px;
            box-shadow: 0 10px 24px rgba(18,214,164,.22);
            transition: transform .18s ease, filter .18s ease;
        }

        .login-button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .ghost { color: #b9d6c9; }
        .ghost:hover { color: #fff; }
        #err { color: #ff9c9c; }

        @media (max-width: 480px) {
            .auth { padding: 16px; }
            .auth-card { padding: 24px 19px; border-radius: 21px; }
            .auth-logo { font-size: 28px; }
        }
</style>
</head>

<body>

<main class="auth">

    <div class="auth-box">

        <div class="auth-logo">
            زولك <span>AI</span> 🇸🇩
        </div>

        <div class="auth-card">

            <h2 id="title">
                أدخل حسابك يا زول 👋
            </h2>

            <div class="auth-subtitle">
                سجّل دخولك عشان تواصل مع زولك AI
            </div>

            <input
                class="auth-input"
                id="name"
                placeholder="الاسم"
                hidden
            >

            <input
                class="auth-input"
                id="email"
                type="email"
                placeholder="الإيميل"
            >

            <input
                class="auth-input"
                id="password"
                type="password"
                placeholder="كلمة المرور"
            >

            <button class="login-button" id="go" type="button">
                دخول
            </button>

            <button class="ghost" id="toggle" type="button">
                ما عندك حساب؟ اعمل واحد
            </button>

            <p id="err"></p>

        </div>

    </div>

</main>


<script>

let reg = false;

const $ = id => document.getElementById(id);


$("toggle").onclick = () => {

    reg = !reg;

    $("name").hidden = !reg;

    $("title").textContent =
        reg
        ? "اعمل حسابك في زولك ❤️"
        : "أدخل حسابك يا زول 👋";

    $("go").textContent =
        reg
        ? "اعمل الحساب"
        : "دخول";

    $("toggle").textContent =
        reg
        ? "عندي حساب بالفعل"
        : "ما عندك حساب؟ اعمل واحد";
};


$("go").onclick = async () => {

    const body = {
        email: $("email").value.trim(),
        password: $("password").value
    };

    if (reg) {
        body.name = $("name").value.trim();
    }

    try {

        const response = await fetch(
            reg ? "/api/register" : "/api/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            }
        );

        const data = await response.json();

        if (data.ok) {

            location.href = "/";

        } else {

            $("err").textContent =
                data.error || "حصل خطأ";

        }

    } catch (error) {

        $("err").textContent =
            "حصل خطأ في الاتصال، جرّب تاني.";

    }
};



</script>

</body>
</html>
