<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابك — زولك AI</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="auth"><div class="logo">زولك <span>AI</span> 🇸🇩</div><div class="card"><h2 id="title">أدخل حسابك يا زول 👋</h2><input id="name" placeholder="الاسم" hidden><input id="email" placeholder="الإيميل"><input id="password" type="password" placeholder="كلمة المرور"><button id="go">دخلني 🚀</button><button class="ghost" id="toggle">ما عندك حساب؟ اعمل واحد</button><p id="err"></p></div></main><script>
let reg=false;const $=x=>document.getElementById(x);$('toggle').onclick=()=>{reg=!reg;$('name').hidden=!reg;$('title').textContent=reg?'اعمل حسابك في زولك ❤️':'أدخل حسابك يا زول 👋';$('go').textContent=reg?'اعمل الحساب 🚀':'دخلني 🚀';$('toggle').textContent=reg?'عندي حساب بالفعل':'ما عندك حساب؟ اعمل واحد'};
$('go').onclick=async()=>{let body={email:$('email').value,password:$('password').value};if(reg)body.name=$('name').value;let r=await fetch(reg?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(d.ok)location.href='/';else $('err').textContent=d.error||'حصل خطأ'};
</script></body></html>
