<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة زولك AI</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="logo">دكان زولك 🏪🇸🇩</div><a href="/">الرئيسية</a></header><main><h1>لوحة التحكم</h1><div class="stats"><div>👥 المستخدمين <b>{{total}}</b></div><div>💬 الرسائل <b>{{msgs}}</b></div><div>🎁 المجاني يومياً <b>{{free}}</b></div></div><section class="card"><h2>إعدادات</h2><label>عدد الاستخدامات المجانية عند التسجيل</label><input id="free" value="{{free}}"><label>رسالة الترحيب</label><textarea id="welcome">أها يا زول 👋❤️ زولك جاهز يساعدك.</textarea><button onclick="save()">حفظ الإعدادات 💾</button></section><section class="card"><h2>المستخدمين</h2><div class="table">{% for u in users %}<div class="tr"><span>{{u['name']}}<br><small>{{u['email']}}</small></span><span>الرصيد: {{u['credits']}}</span>{% if not u['is_admin'] %}<button onclick="credit({{u['id']}})">+10 رصيد</button>{% endif %}</div>{% endfor %}</div></section></main><script>
async function save(){await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({free_credits:document.getElementById('free').value,welcome:document.getElementById('welcome').value})});alert('اتحفظت يا زول ❤️')}
async function credit(id){await fetch('/api/admin/user/'+id+'/credits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:10})});location.reload()}
</script></body></html>
