<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>لوحة زولك AI 🇸🇩</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #212121;
            color: #ffffff;
        }

        .admin-page {
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        /* الهيدر */

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;

            padding: 15px 0 20px;
            margin-bottom: 20px;

            border-bottom: 1px solid #3b3b3b;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
        }

        .home-link {
            color: #ddd;
            text-decoration: none;
            font-size: 15px;
        }

        .home-link:hover {
            color: #fff;
        }

        /* العنوان */

        .admin-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;

            margin-bottom: 20px;
        }

        .admin-title h1 {
            margin: 0;
            font-size: 28px;
        }

        /* البطاقات */

        .card {
            background: #2a2a2a;
            color: #fff;

            border: 1px solid #3b3b3b;
            border-radius: 16px;

            padding: 20px;
            margin: 18px 0;

            box-shadow: 0 4px 20px rgba(0,0,0,.20);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 18px;

            font-size: 20px;
            color: #fff;
        }

        /* الإحصائيات */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .stat {
            background: #303030;

            border: 1px solid #414141;
            border-radius: 14px;

            padding: 20px;

            text-align: center;
            color: #fff;
        }

        .stat-title {
            font-size: 15px;
            color: #ccc;
        }

        .stat b {
            display: block;

            margin-top: 8px;

            font-size: 27px;
            color: #fff;
        }

        /* الحقول */

        label {
            display: block;

            margin-bottom: 5px;

            color: #ddd;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            margin: 6px 0 16px;

            border: 1px solid #555;
            border-radius: 10px;

            background: #202020;
            color: #fff;

            font-family: inherit;
            font-size: 15px;

            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #888;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* الأزرار */

        button {
            border: 0;
            border-radius: 10px;

            padding: 10px 15px;

            margin: 3px;

            cursor: pointer;

            font-family: inherit;
            font-size: 14px;

            transition: opacity .15s ease,
                        transform .15s ease;
        }

        button:hover {
            opacity: .88;
        }

        button:active {
            transform: scale(.98);
        }

        .primary {
            background: #fff;
            color: #111;
        }

        .success {
            background: #198754;
            color: #fff;
        }

        .danger {
            background: #d32f2f;
            color: #fff;
        }

        .logout-btn {
            background: #444;
            color: #fff;
        }

        /* المستخدمين */

        .user {
            background: #242424;

            border: 1px solid #444;
            border-radius: 14px;

            padding: 15px;
            margin: 10px 0;
        }

        .userhead {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 12px;
            flex-wrap: wrap;
        }

        .user-name {
            font-size: 16px;
            font-weight: 700;
        }

        .email {
            margin-top: 5px;

            color: #aaa;
            font-size: 14px;
        }

        .balance {
            margin-top: 12px;

            color: #ddd;
        }

        .actions {
            margin-top: 12px;

            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* الحالة */

        .badge {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 8px;

            background: #444;
            color: #fff;

            font-size: 13px;
        }

        .banned {
            background: #5a2020;
            color: #ffb5b5;
        }

        /* الحقوق */

        .rights {
            text-align: center;

            color: #888;

            padding: 25px 10px 35px;

            line-height: 1.8;
        }

        /* موبايل */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .admin-page {
                padding: 12px;
            }

            .admin-title h1 {
                font-size: 23px;
            }

            .card {
                padding: 15px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat {
                padding: 15px 10px;
            }

            .stat b {
                font-size: 23px;
            }

            .actions button {
                flex: 1 1 auto;
            }

        }

        @media (max-width: 380px) {

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

<div class="admin-page">

<div class="admin-container">


    <!-- الهيدر -->

    <header class="admin-header">

        <div class="logo">
            زولك AI 🇸🇩
        </div>

        <a class="home-link" href="/">
            الرئيسية
        </a>

    </header>


    <!-- العنوان -->

    <div class="admin-title">

        <h1>
            🛡️ لوحة المدير
        </h1>

        <a href="/logout">
            <button class="logout-btn">
                تسجيل الخروج
            </button>
        </a>

    </div>


    <!-- الإحصائيات -->

    <section class="stats">

        <div class="stat">

            <div class="stat-title">
                👥 المستخدمين
            </div>

            <b>
                {{ total }}
            </b>

        </div>


        <div class="stat">

            <div class="stat-title">
                💬 الرسائل
            </div>
