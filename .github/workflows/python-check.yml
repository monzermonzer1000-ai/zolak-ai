name: Check Zolak AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: zolak-ci-secret-key-not-for-production
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-test-password
      ADMIN_NAME: CI Test Admin
      DATABASE_PATH: /tmp/zolak-ci.db
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app.py
          node --check static/app.js
          python -m json.tool manifest.json > /dev/null

      - name: Smoke-test website and account APIs
        run: |
          python - <<'PY'
          import app

          client = app.app.test_client()

          assert client.get("/").status_code == 200
          assert client.get("/health").status_code == 200
          assert client.get("/manifest.json").status_code == 200
          assert client.get("/sw.js").status_code == 200

          registered = client.post("/api/register", json={
              "name": "CI User",
              "email": "user@example.test",
              "password": "test-password"
          })
          assert registered.status_code == 200, registered.get_json()

          me = client.get("/api/me").get_json()
          assert me.get("logged_in") is True, me

          created = client.post("/api/conversations", json={})
          assert created.status_code == 200, created.get_json()
          conversation_id = created.get_json()["conversation_id"]

          opened = client.get(f"/api/conversations/{conversation_id}")
          assert opened.status_code == 200, opened.get_json()

          deleted = client.delete(f"/api/conversations/{conversation_id}")
          assert deleted.status_code == 200, deleted.get_json()

          # Missing API keys must produce a clear configuration error.
          ai = client.post("/api/chat", json={"message": "اختبار"})
          assert ai.status_code == 503, ai.get_json()
          assert "GEMINI_API_KEY" in ai.get_json().get("error", "")

          # Mock Gemini so CI can exercise a successful response without
          # storing or spending a real API key.
          import os
          import sys
          import types as pytypes
          from types import SimpleNamespace

          class FakePart:
              @classmethod
              def from_text(cls, text):
                  return SimpleNamespace(text=text)

          class FakeContent:
              def __init__(self, role, parts):
                  self.role = role
                  self.parts = parts

          class FakeConfig:
              def __init__(self, **kwargs):
                  self.options = kwargs

          class FakeModels:
              def generate_content(self, **kwargs):
                  return SimpleNamespace(text="رد تجريبي من زولك AI")

          class FakeClient:
              def __init__(self, api_key):
                  self.models = FakeModels()

          google_module = pytypes.ModuleType("google")
          genai_module = pytypes.ModuleType("google.genai")
          genai_types = pytypes.ModuleType("google.genai.types")
          genai_module.Client = FakeClient
          genai_module.types = genai_types
          genai_types.Part = FakePart
          genai_types.Content = FakeContent
          genai_types.GenerateContentConfig = FakeConfig
          google_module.genai = genai_module
          sys.modules["google"] = google_module
          sys.modules["google.genai"] = genai_module
          sys.modules["google.genai.types"] = genai_types
          os.environ["GEMINI_API_KEY"] = "ci-fake-key"

          ai_ok = client.post("/api/chat", json={"message": "اختبار الرد"})
          assert ai_ok.status_code == 200, ai_ok.get_json()
          assert ai_ok.get_json().get("answer") == "رد تجريبي من زولك AI"
          conversation_id = ai_ok.get_json()["conversation_id"]

          history = client.get(f"/api/conversations/{conversation_id}")
          assert history.status_code == 200, history.get_json()
          assert len(history.get_json()["chats"]) == 2

          client.get("/logout")
          admin_login = client.post("/api/login", json={
              "email": "admin@example.test",
              "password": "ci-test-password"
          })
          assert admin_login.status_code == 200, admin_login.get_json()

          health = client.get("/api/admin/health")
          assert health.status_code == 200, health.get_json()
          assert health.get_json()["checks"]["gemini"]["status"] == "ok"

          ai_test = client.post("/api/admin/ai-test", json={})
          assert ai_test.status_code == 200, ai_test.get_json()
          assert ai_test.get_json()["answer"] == "رد تجريبي من زولك AI"

          print("Zolak AI smoke tests passed.")
          PY
