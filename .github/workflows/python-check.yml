name: Check Zolak AI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: zolak-ci-secret-key-not-for-production
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-test-password
      ADMIN_NAME: CI Test Admin
      DATABASE_PATH: /tmp/zolak-ci.db
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app.py
          node --check static/app.js
          python -m json.tool manifest.json > /dev/null

      - name: Smoke-test website and account APIs
        run: |
          python - <<'PY'
          import app

          client = app.app.test_client()

          assert client.get("/").status_code == 200
          assert client.get("/health").status_code == 200
          assert client.get("/manifest.json").status_code == 200
          assert client.get("/sw.js").status_code == 200
          assert "zolak-ai-assets-v27" in client.get("/sw.js").get_data(as_text=True)
          home_html = client.get("/").get_data(as_text=True)
          assert "/static/mobile-fixes.css?v=1" in home_html
          assert "/static/performance.css?v=2" in home_html
          assert client.get("/static/mobile-fixes.css").status_code == 200
          performance_css = client.get("/static/performance.css").get_data(as_text=True)
          assert "backdrop-filter: none" in performance_css
          assert "display: none" in performance_css
          assert client.get("/static/style.css").status_code == 200
          assert client.get("/static/app.js").status_code == 200

          registered = client.post("/api/register", json={
              "name": "CI User",
              "email": "user@example.test",
              "password": "test-password"
          })
          assert registered.status_code == 200, registered.get_json()

          me = client.get("/api/me").get_json()
          assert me.get("logged_in") is True, me
          user_id = me["id"]

          # A normal account must never access administrator APIs.
          forbidden = client.get("/api/admin/stats")
          assert forbidden.status_code == 403, forbidden.get_json()

          created = client.post("/api/conversations", json={})
          assert created.status_code == 200, created.get_json()
          conversation_id = created.get_json()["conversation_id"]

          project_created = client.post("/api/projects", json={"name": "مشروع CI"})
          assert project_created.status_code == 201, project_created.get_json()
          project_id = project_created.get_json()["project_id"]
          project_list = client.get("/api/projects").get_json()["projects"]
          assert any(project["id"] == project_id for project in project_list)
          project_renamed = client.patch(f"/api/projects/{project_id}", json={"name": "مشروع اختبار"})
          assert project_renamed.status_code == 200, project_renamed.get_json()

          opened = client.get(f"/api/conversations/{conversation_id}")
          assert opened.status_code == 200, opened.get_json()

          deleted = client.delete(f"/api/conversations/{conversation_id}")
          assert deleted.status_code == 200, deleted.get_json()

          # Missing API keys must produce a clear configuration error.
          ai = client.post("/api/chat", json={"message": "اختبار"})
          assert ai.status_code == 503, ai.get_json()
          assert "مفتاح Gemini" in ai.get_json().get("error", "")

          # Mock Gemini so CI can exercise a successful response without
          # storing or spending a real API key.
          import os
          import sys
          import types as pytypes
          from types import SimpleNamespace

          class FakePart:
              @classmethod
              def from_text(cls, text):
                  return SimpleNamespace(text=text)

          class FakeContent:
              def __init__(self, role, parts):
                  self.role = role
                  self.parts = parts

          class FakeConfig:
              def __init__(self, **kwargs):
                  self.options = kwargs

          class FakeModels:
              fail_primary = False
              calls = []
              primary_error = "503 UNAVAILABLE: temporary high demand"

              def generate_content(self, **kwargs):
                  if self.fail_primary and kwargs.get("model") == "gemini-3.5-flash-lite":
                      raise RuntimeError(self.primary_error)
                  return SimpleNamespace(text="رد تجريبي من زولك AI")

              def generate_content_stream(self, **kwargs):
                  self.calls.append(kwargs.get("model"))
                  if self.fail_primary and kwargs.get("model") == "gemini-3.5-flash-lite":
                      raise RuntimeError(self.primary_error)
                  yield SimpleNamespace(text="رد تجريبي من زولك AI")

          class FakeClient:
              def __init__(self, api_key, http_options=None):
                  self.models = FakeModels()

          google_module = pytypes.ModuleType("google")
          genai_module = pytypes.ModuleType("google.genai")
          genai_types = pytypes.ModuleType("google.genai.types")
          genai_module.Client = FakeClient
          genai_module.types = genai_types
          genai_types.Part = FakePart
          genai_types.Content = FakeContent
          genai_types.GenerateContentConfig = FakeConfig
          genai_types.ThinkingConfig = FakeConfig
          genai_types.HttpOptions = FakeConfig
          genai_types.HttpRetryOptions = FakeConfig
          google_module.genai = genai_module
          sys.modules["google"] = google_module
          sys.modules["google.genai"] = genai_module
          sys.modules["google.genai.types"] = genai_types
          os.environ["GEMINI_API_KEY"] = "ci-fake-key"

          import json

          def parse_sse(response):
              events = []
              for block in response.get_data(as_text=True).split("\n\n"):
                  event_name = None
                  data_line = None
                  for line in block.splitlines():
                      if line.startswith("event: "):
                          event_name = line[7:]
                      elif line.startswith("data: "):
                          data_line = line[6:]
                  if event_name and data_line:
                      events.append((event_name, json.loads(data_line)))
              return events

          ai_ok = client.post("/api/chat", json={"message": "اختبار الرد"}, buffered=True)
          assert ai_ok.status_code == 200
          ok_events = parse_sse(ai_ok)
          assert any(name == "token" and payload.get("text") == "رد تجريبي من زولك AI" for name, payload in ok_events)
          conversation_id = next(payload["conversation_id"] for name, payload in ok_events if name == "meta")

          assigned = client.patch(f"/api/conversations/{conversation_id}", json={"project_id": project_id})
          assert assigned.status_code == 200, assigned.get_json()
          project_conversations = client.get(f"/api/conversations?project_id={project_id}").get_json()["conversations"]
          assert any(row["id"] == conversation_id and row["project_id"] == project_id for row in project_conversations)
          unassigned = client.patch(f"/api/conversations/{conversation_id}", json={"project_id": None})
          assert unassigned.status_code == 200, unassigned.get_json()
          project_deleted = client.delete(f"/api/projects/{project_id}")
          assert project_deleted.status_code == 200, project_deleted.get_json()

          # Pin/unpin must persist and appear in the dedicated list data.
          pinned = client.patch(f"/api/conversations/{conversation_id}", json={"is_pinned": True})
          assert pinned.status_code == 200, pinned.get_json()
          listed = client.get("/api/conversations").get_json()["conversations"]
          assert any(row["id"] == conversation_id and row["is_pinned"] for row in listed)
          unpinned = client.patch(f"/api/conversations/{conversation_id}", json={"is_pinned": False})
          assert unpinned.status_code == 200, unpinned.get_json()

          # A temporary 503 from the primary model must use the lighter fallback.
          FakeModels.calls = []
          FakeModels.fail_primary = True
          ai_fallback = client.post("/api/chat", json={"message": "اختبار الموديل الاحتياطي"}, buffered=True)
          FakeModels.fail_primary = False
          assert ai_fallback.status_code == 200
          assert any(name == "token" and payload.get("text") == "رد تجريبي من زولك AI" for name, payload in parse_sse(ai_fallback))
          assert FakeModels.calls == ["gemini-3.5-flash-lite", "gemini-3.8-flash"], FakeModels.calls

          # A deadline timeout must fail within the bounded wait; do not start
          # a second slow model request after the primary deadline.
          FakeModels.calls = []
          FakeModels.primary_error = "504 DEADLINE_EXCEEDED: upstream deadline"
          FakeModels.fail_primary = True
          ai_timeout = client.post("/api/chat", json={"message": "اختبار مهلة الموديل"}, buffered=True)
          FakeModels.fail_primary = False
          assert ai_timeout.status_code == 200
          timeout_events = parse_sse(ai_timeout)
          assert any(name == "error" for name, payload in timeout_events)
          assert not any(name == "token" for name, payload in timeout_events)
          assert FakeModels.calls == ["gemini-3.5-flash-lite"], FakeModels.calls

          history = client.get(f"/api/conversations/{conversation_id}")
          assert history.status_code == 200, history.get_json()
          assert len(history.get_json()["chats"]) == 2

          client.get("/logout")
          admin_login = client.post("/api/login", json={
              "email": "admin@example.test",
              "password": "ci-test-password"
          })
          assert admin_login.status_code == 200, admin_login.get_json()

          health = client.get("/api/admin/health")
          assert health.status_code == 200, health.get_json()
          assert health.get_json()["checks"]["gemini"]["status"] == "ok"

          ai_test = client.post("/api/admin/ai-test", json={})
          assert ai_test.status_code == 200, ai_test.get_json()
          assert ai_test.get_json()["answer"] == "رد تجريبي من زولك AI"

          # Administrator role changes must persist, and the active/last admin
          # must not be able to remove their own access.
          promoted = client.patch(f"/api/admin/user/{user_id}", json={"is_admin": True})
          assert promoted.status_code == 200, promoted.get_json()
          users_after_promotion = client.get("/api/admin/users").get_json()["users"]
          promoted_user = next(user for user in users_after_promotion if user["id"] == user_id)
          assert promoted_user["is_admin"] in (1, True)

          demoted = client.patch(f"/api/admin/user/{user_id}", json={"is_admin": False})
          assert demoted.status_code == 200, demoted.get_json()
          users_after_demotion = client.get("/api/admin/users").get_json()["users"]
          demoted_user = next(user for user in users_after_demotion if user["id"] == user_id)
          assert demoted_user["is_admin"] in (0, False)

          admin_id = client.get("/api/me").get_json()["id"]
          self_demote = client.patch(f"/api/admin/user/{admin_id}", json={"is_admin": False})
          assert self_demote.status_code == 400, self_demote.get_json()

          # Administrator settings and backup must include conversations.
          settings = client.get("/api/admin/settings")
          assert settings.status_code == 200, settings.get_json()
          saved = client.post("/api/admin/settings", json={
              "announcement": "CI announcement",
              "enable_history": "true"
          })
          assert saved.status_code == 200, saved.get_json()

          # The backup download endpoint must return an actual attachment.
          backup = client.get("/api/admin/backup/download")
          assert backup.status_code == 200
          assert "attachment" in backup.headers.get("Content-Disposition", "").lower()
          assert "zolak-ai-backup.json" in backup.headers.get("Content-Disposition", "")
          import json
          backup_data = json.loads(backup.data.decode("utf-8"))
          assert "conversations" in backup_data
          assert "projects" in backup_data
          assert len(backup_data["conversations"]) >= 1
          assert len(backup_data["chats"]) >= 2
          assert all("conversation_id" in row for row in backup_data["chats"])
          assert all("project_id" in row and "is_pinned" in row for row in backup_data["conversations"])

          # Exercise credit, ban, unban, and delete operations.
          credit = client.post(f"/api/admin/user/{user_id}/credits", json={"amount": 5})
          assert credit.status_code == 200, credit.get_json()
          banned = client.post(f"/api/admin/user/{user_id}/ban")
          assert banned.status_code == 200, banned.get_json()
          unbanned = client.post(f"/api/admin/user/{user_id}/unban")
          assert unbanned.status_code == 200, unbanned.get_json()
          deleted_user = client.delete(f"/api/admin/user/{user_id}")
          assert deleted_user.status_code == 200, deleted_user.get_json()

          # The new-chat welcome screen must use the admin-configured copy.
          home_source = open("templates/index.html", encoding="utf-8").read()
          app_source = open("static/app.js", encoding="utf-8").read()
          admin_source = open("templates/admin.html", encoding="utf-8").read()
          assert 'data-welcome="{{ welcome or' in home_source
          assert 'messages.dataset.welcome' in app_source
          assert 'messages.dataset.homeTitle' in app_source
          assert '"/api/admin/backup/download"' in admin_source
          assert 'id="projectsPanel"' in home_source
          assert 'id="explorePanel"' in home_source
          assert 'class="home-icon-button mobile-menu"' in home_source
          assert "plusSubscribe" not in home_source
          assert "homeQuickActions" not in home_source
          login_source = open("templates/login.html", encoding="utf-8").read()
          css_source = open("static/style.css", encoding="utf-8").read()
          performance_source = open("static/performance.css", encoding="utf-8").read()
          assert "sudan-flag-background.jpg" not in home_source + login_source + css_source + performance_source
          assert "filename='style.css') }}?v=27" in home_source
          assert "filename='performance.css') }}?v=2" in home_source
          assert "filename='app.js') }}?v=26" in home_source
          assert 'data-tool="remote"' not in home_source
          assert 'data-tool="customize"' not in home_source

          print("Zolak AI smoke tests passed.")
          PY