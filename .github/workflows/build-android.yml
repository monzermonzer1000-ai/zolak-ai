
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android.yml'
      - 'zolak-ai-android-fixed.zip'
      - 'zolak-ai-android.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          set -e
          if [ -f zolak-ai-android-fixed.zip ]; then
            ZIP_FILE="zolak-ai-android-fixed.zip"
          elif [ -f zolak-ai-android.zip ]; then
            ZIP_FILE="zolak-ai-android.zip"
          else
            echo "Android ZIP file not found"
            exit 1
          fi

          mkdir -p android-source
          unzip -q "$ZIP_FILE" -d android-source

          SETTINGS_FILE=$(find android-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zolak-ai-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
