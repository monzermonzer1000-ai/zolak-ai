name: Build Zolak AI Android

on:
  workflow_dispatch:
  push:
    paths:
      - "zolak-ai-android.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q zolak-ai-android.zip -d android-project

      - name: Build Release AAB
        working-directory: android-project
        run: |
          gradle --no-daemon :app:bundleRelease

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: zolak-ai-release
          path: android-project/app/build/outputs/bundle/release/app-release.aab
