name: Build Zolak AI Android

on:
  workflow_dispatch:
  push:
    paths:
      - "zolak-ai-android-fixed.zip"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q zolak-ai-android-fixed.zip -d android-project
          test -f android-project/zolak-ai-android/settings.gradle

      - name: Build debug APK
        working-directory: android-project/zolak-ai-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release AAB
        working-directory: android-project/zolak-ai-android
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: zolak-ai-android-build
          path: |
            android-project/zolak-ai-android/app/build/outputs/apk/debug/app-debug.apk
            android-project/zolak-ai-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
